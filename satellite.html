<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nijju's Eye global intelligence dashboard"
    />
    <title>Nijju's Eye | Dashboard</title>
    <script>
      if (new URLSearchParams(location.search).get('intro') === '1') {
        document.documentElement.dataset.introPending = 'true';
        window.nijjuIntroWatchdog = setTimeout(() => {
          delete document.documentElement.dataset.introPending;
        }, 5000);
      }
    </script>
    <style>
      [data-intro-pending] .app-shell {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div class="app-shell" id="dashboard-root"></div>
    <noscript
      ><p>
        JavaScript is required for the dashboard.
        <a href="/?globe=1">Open globe</a>
      </p></noscript
    >
    <script type="module" src="/src/satellite/tallie-app.jsx"></script>
    <script type="module" src="/src/launch/launch.js"></script>
  </body>
</html>
